# Gradle properties for the 26.1 NeoForge port.
# MDG's createMinecraftArtifacts is incompatible with the configuration cache on Gradle 9.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx3G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.114
neoforge_loader_version_range=[1,)

## Mod properties
mod_id=brewinandchewin
mod_name=Brewin' And Chewin'
mod_license=MIT
mod_version=5.0.0-ex261
mod_group_id=umpaz.brewinandchewin
mod_authors=Probleyes, Umpaz, MerchantCalico
mod_description=Fermenting addon for Farmer's Delight.
sources=MerchantPug/BrewinAndChewin

## Dependencies.
## 26.1 ships unobfuscated, so plain mod jars compile against it directly (no deobf step).
## Farmer's Delight and AppleSkin have no 26.1 maven yet, so both are vendored into libs/.
jei_version=29.43.0.107
farmers_delight_range=[1.3.3,)
farmersdelight_jar=libs/FarmersDelight-26.1.2-1.3.3-fix4.jar
appleskin_jar=libs/appleskin-neoforge-mc26.1-3.0.9.jar
